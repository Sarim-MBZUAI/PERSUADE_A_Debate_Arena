[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spar"
version = "0.1.0"
description = "Strategic Planning and Argumentative Reinforcement for LLM Debate Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SPAR Team"}
]
keywords = ["llm", "debate", "reinforcement-learning", "grpo", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "accelerate>=0.25.0",
    "openai>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "wandb>=0.16.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
all = [
    "sentence-transformers>=2.2.0",
    "datasets>=2.14.0",
    "bitsandbytes>=0.41.0",
]

[project.scripts]
spar-train = "scripts.train:main"
spar-eval = "scripts.evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spar*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
