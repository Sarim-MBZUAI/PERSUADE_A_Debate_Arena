# SFT Configuration: Qwen3-4B on kimi-k2 Expert Demonstrations
# Stage 1 of multi-paradigm training pipeline

model:
  name_or_path: "Qwen/Qwen3-4B-Instruct-2507"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

debate:
  num_turns: 4
  positions:
    - "FOR"
    - "AGAINST"

judge:
  judge_type: "local"
  local_model_path: "AtlaAI/Selene-1-Mini-Llama-3.1-8B"

reward:
  outcome_weight: 1.0
  for_win_bonus: 1.5
  format_weight: 0.05

training:
  num_epochs: 3
  batch_size: 4
  learning_rate: 2.0e-5
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  use_amp: true
  use_wandb: false
  log_every: 10
  eval_every: 200
  save_every: 500

loss_type: "spar"
paradigm: "sft"
arena_data_dir: "data/debate-arena"
